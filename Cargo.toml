[workspace]
members = ["packages/ss-ai-assessment", "packages/ss-ai-cargo", "packages/ss-ai-cargo/fuzz", "packages/ss-ai-git", "packages/ss-ai-review", "packages/ss-ai-runtime", "packages/ss-ai"]
resolver = "3"

[workspace.package]
authors = ["Sander Saares <sander@saares.eu>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sandersaares/ss-ai"
rust-version = "1.98.1"
include = ["src/**/*"]

[workspace.dependencies]
clap = { version = "4.6.1", default-features = false, features = ["default"] }
glob = { version = "0.3.3", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libfuzzer-sys = { version = "0.4.10", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
ohno = { version = "0.5.0", default-features = false }
regex = { version = "1.12.2", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false }
same-file = { version = "1.0.6", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
ss-ai-assessment = { path = "packages/ss-ai-assessment", default-features = false }
ss-ai-cargo = { path = "packages/ss-ai-cargo", default-features = false }
ss-ai-git = { path = "packages/ss-ai-git", default-features = false }
ss-ai-review = { path = "packages/ss-ai-review", default-features = false }
ss-ai-runtime = { path = "packages/ss-ai-runtime", default-features = false }
static_assertions = { version = "1.1.0", default-features = false }
tempfile = { version = "3.20.0", default-features = false }
tick = { version = "0.7.1", default-features = false }
toml_edit = { version = "0.25.17", default-features = false }
tokio = { version = "1.53.3", default-features = false }
url = { version = "2.5.7", default-features = false, features = ["std"] }
uuid = { version = "1.18.1", default-features = false, features = ["std"] }
windows-sys = { version = "0.61.2", default-features = false }

# Folo is the canonical lint configuration; do not customize this copy.
# When upgrading tooling versions, copy-paste the full lint section and
# clippy.toml from folo-rs/folo again and update the source revision below.
# Comments inside the copied configuration refer to Folo's tooling.
# Source: https://github.com/folo-rs/folo/blob/5b7761ff275b865bdb9f8ac5a3b610cc50f88b6d/Cargo.toml
[workspace.lints.rust]
# https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html
closure_returning_async_block = "warn"
elided_lifetimes_in_paths = "warn"
# Unstable: fuzzy_provenance_casts = "warn"
# Unstable: lossy_provenance_casts = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
# Unstable: must_not_suspend = "warn"
trivial_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
# Unstable: unqualified_local_imports = "warn"
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_macros = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(careful)',
    'cfg(coverage_nightly)',
    # Set by the `just mutants` recipe via RUSTFLAGS; lets tests opt out of mutation runs via `cfg_attr(mutants, ignore)`.
    'cfg(mutants)',
] }

[workspace.lints.rustdoc]
private_doc_tests = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
absolute_paths = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_ptr_cast_mut = "warn"
assertions_on_result_states = "warn"
assigning_clones = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_ptr_alignment = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
coerce_container_to_any = "warn"
cognitive_complexity = "warn"
collection_is_never_read = "warn"
copy_iterator = "warn"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
doc_broken_link = "warn"
doc_link_with_quotes = "warn"
doc_markdown = "warn"
doc_paragraphs_missing_punctuation = "warn"
duration_suboptimal_units = "warn"
empty_drop = "warn"

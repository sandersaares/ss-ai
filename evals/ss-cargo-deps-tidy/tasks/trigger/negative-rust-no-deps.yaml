id: trigger-negative-rust-no-deps
name: Trigger - Rust code edit without dependency changes
description: >
  A Rust-related request that does not touch any Cargo.toml or dependency
  declarations. The skill must not be invoked.
tags:
  - trigger
context_dir: evals/ss-cargo-deps-tidy/fixtures/trigger/trigger-negative-rust-no-deps
inputs:
  prompt: >
    Refactor the `match` expression inside `parse_packet` in src/parser.rs
    so it returns a Result instead of panicking on unknown variants.

    Note: there is no Rust toolchain available in this environment. Do not
    run any cargo commands, just perform text edits without Cargo verification.
  files:
    - path: Cargo.toml
    - path: src/lib.rs
    - path: src/parser.rs
graders:
  - type: behavior
    name: skill-not-invoked
    config:
      forbidden_tools:
        - skill

id: trigger-positive-implicit
name: Trigger - Implicit dependency edit
description: >
  The user describes a dependency-related change without naming the skill.
  The skill should still recognize the situation via its activation hint.
tags:
  - trigger
inputs:
  prompt: >
    I bumped the minimum supported version of serde in the workspace and
    moved a couple of crate-level dependency entries up to the workspace
    level. Can you review the Cargo.toml files?
graders:
  - type: trigger
    name: trigger-positive
    config:
      skill_path: skills/ss-cargo-deps-tidy/SKILL.md
      mode: positive
      threshold: 0.6

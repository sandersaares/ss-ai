id: trigger-negative-other-language
name: Trigger - Dependency edit in non-Rust project
description: >
  A dependency edit in a different ecosystem (Node.js / package.json).
  The skill is Cargo-specific and must not be invoked.
tags:
  - trigger
inputs:
  prompt: >
    Add lodash@^4.17.21 to dependencies in package.json and run npm install.
graders:
  - type: behavior
    name: skill-not-invoked
    config:
      forbidden_tools:
        - skill

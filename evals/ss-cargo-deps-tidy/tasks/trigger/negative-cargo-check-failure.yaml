id: trigger-negative-cargo-check-failure
name: Trigger - Diagnose cargo check failure (no dependency change)
description: >
  A Cargo workspace request that asks the agent to diagnose a `cargo check`
  failure. The error is a source-code compile error, not a dependency
  problem, and no dependency edits are implied. The skill must not be
  invoked.
tags:
  - trigger
context_dir: evals/ss-cargo-deps-tidy/fixtures/trigger/trigger-negative-cargo-check-failure
inputs:
  prompt: >
    Running `cargo check` in this workspace produces the failure below.
    Please diagnose the cause and propose a fix.

    ```
    error[E0425]: cannot find function `parse_header` in this scope
      --> src/lib.rs:6:13
       |
    6  |     let h = parse_header(input);
       |             ^^^^^^^^^^^^ not found in this scope
    ```

    Note: there is no Rust toolchain available in this environment. Do not
    re-run cargo; work from the error message above.
  files:
    - path: Cargo.toml
    - path: src/lib.rs
graders:
  - type: behavior
    name: skill-not-invoked
    config:
      forbidden_tools:
        - skill

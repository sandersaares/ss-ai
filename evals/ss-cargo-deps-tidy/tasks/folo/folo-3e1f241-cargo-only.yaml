id: folo-3e1f241-cargo-only
name: Folo @ 3e1f241 - Cargo.toml-only tidy
description: >
  Real-world fixture extracted from folo-rs/folo at commit
  3e1f241ddfb6de7ab0ecca1a54ca923807135d83. The agent is given only the
  Cargo.toml files (no source, no Cargo.lock, no AGENTS.md) and asked to
  apply ss-cargo-deps-tidy without running cargo. Exercises stages 2
  (version padding), 4 (centralization), 5 (default-features), and 6
  (feature placement). Stage 7 (min-version verification) is partially
  covered via regex spot-checks against patch components that folo
  required to satisfy minimum version compatibility.
tags:
  - folo
  - real-world
  - cargo-only
timeout_seconds: 1800
inputs:
  prompt: >
    The Cargo.toml files of a Rust workspace have been placed in your
    workspace directory. The root manifest is `Cargo.toml`; member
    manifests live under `packages/*/Cargo.toml`.

    Apply the `ss-cargo-deps-tidy` skill to this workspace.

    Important constraints for this run:

    - This is a manifest-only fixture. There are no source files, no
      Cargo.lock, no AGENTS.md, and no justfile. Do not attempt to run
      any `cargo` commands; the skill's workspace build verification
      (the `cargo check` step in stage 5 and the entire stage 7
      `cargo generate-lockfile` / build pass) is out of scope here.

    - Still perform the stage 7 reasoning where possible: if a workspace
      dependency declares a version requirement with fewer than three
      components, pad it; and if you have reason to believe the declared
      minimum version is below what the published code actually requires,
      raise it accordingly.

    - All other stages (1 inventory, 2 style, 3 dev-deps path-only,
      4 centralization, 5 default-features, 6 package-level features,
      8 cleanup) apply as written.

    - WORKAROUND for an upstream waza/copilot-cli bug (tracked at
      microsoft/waza; see copilot-sdk#947): do not invoke the `task`
      tool to spawn sub-agents in this run. Sub-agent tool calls
      currently hang indefinitely because the bundled copilot-cli
      1.0.2 in waza 0.31.0 predates the sub-agent permission fix
      (shipped in copilot-cli 1.0.49). Read and edit files directly
      with `view` / `str_replace` / `create`. Once waza ships a
      release with copilot-cli >= 1.0.49 this constraint should be
      removed.
  files:
    - path: Cargo.toml
    - path: packages/alloc_tracker/Cargo.toml
    - path: packages/all_the_time/Cargo.toml
    - path: packages/awaiter_set/Cargo.toml
    - path: packages/benchmarks/Cargo.toml
    - path: packages/cargo-detect-package/Cargo.toml
    - path: packages/cpulist/Cargo.toml
    - path: packages/events/Cargo.toml
    - path: packages/events_once/Cargo.toml
    - path: packages/fast_time/Cargo.toml
    - path: packages/folo_ffi/Cargo.toml
    - path: packages/folo_utils/Cargo.toml
    - path: packages/future_deque/Cargo.toml
    - path: packages/infinity_pool/Cargo.toml
    - path: packages/linked/Cargo.toml
    - path: packages/linked_macros/Cargo.toml
    - path: packages/linked_macros_impl/Cargo.toml
    - path: packages/many_cpus/Cargo.toml
    - path: packages/many_cpus_benchmarking/Cargo.toml
    - path: packages/new_zealand/Cargo.toml
    - path: packages/nm/Cargo.toml
    - path: packages/nm_otel/Cargo.toml
    - path: packages/par_bench/Cargo.toml
    - path: packages/region_cached/Cargo.toml
    - path: packages/region_local/Cargo.toml
    - path: packages/testing/Cargo.toml
    - path: packages/ui_tests/Cargo.toml
    - path: packages/vicinal/Cargo.toml
expected:
  outcomes:
    - type: task_completed
graders:
  - name: cargo-manifests-match-expected
    type: diff
    config:
      context_dir: evals/ss-cargo-deps-tidy/fixtures
      expected_files:
        - { path: Cargo.toml, snapshot: folo-3e1f241-expected/Cargo.toml }
        - { path: packages/alloc_tracker/Cargo.toml, snapshot: folo-3e1f241-expected/packages/alloc_tracker/Cargo.toml }
        - { path: packages/all_the_time/Cargo.toml, snapshot: folo-3e1f241-expected/packages/all_the_time/Cargo.toml }
        - { path: packages/awaiter_set/Cargo.toml, snapshot: folo-3e1f241-expected/packages/awaiter_set/Cargo.toml }
        - { path: packages/benchmarks/Cargo.toml, snapshot: folo-3e1f241-expected/packages/benchmarks/Cargo.toml }
        - { path: packages/cargo-detect-package/Cargo.toml, snapshot: folo-3e1f241-expected/packages/cargo-detect-package/Cargo.toml }
        - { path: packages/cpulist/Cargo.toml, snapshot: folo-3e1f241-expected/packages/cpulist/Cargo.toml }
        - { path: packages/events/Cargo.toml, snapshot: folo-3e1f241-expected/packages/events/Cargo.toml }
        - { path: packages/events_once/Cargo.toml, snapshot: folo-3e1f241-expected/packages/events_once/Cargo.toml }
        - { path: packages/fast_time/Cargo.toml, snapshot: folo-3e1f241-expected/packages/fast_time/Cargo.toml }
        - { path: packages/folo_ffi/Cargo.toml, snapshot: folo-3e1f241-expected/packages/folo_ffi/Cargo.toml }
        - { path: packages/folo_utils/Cargo.toml, snapshot: folo-3e1f241-expected/packages/folo_utils/Cargo.toml }
        - { path: packages/future_deque/Cargo.toml, snapshot: folo-3e1f241-expected/packages/future_deque/Cargo.toml }
        - { path: packages/infinity_pool/Cargo.toml, snapshot: folo-3e1f241-expected/packages/infinity_pool/Cargo.toml }
        - { path: packages/linked/Cargo.toml, snapshot: folo-3e1f241-expected/packages/linked/Cargo.toml }
        - { path: packages/linked_macros/Cargo.toml, snapshot: folo-3e1f241-expected/packages/linked_macros/Cargo.toml }
        - { path: packages/linked_macros_impl/Cargo.toml, snapshot: folo-3e1f241-expected/packages/linked_macros_impl/Cargo.toml }
        - { path: packages/many_cpus/Cargo.toml, snapshot: folo-3e1f241-expected/packages/many_cpus/Cargo.toml }
        - { path: packages/many_cpus_benchmarking/Cargo.toml, snapshot: folo-3e1f241-expected/packages/many_cpus_benchmarking/Cargo.toml }
        - { path: packages/new_zealand/Cargo.toml, snapshot: folo-3e1f241-expected/packages/new_zealand/Cargo.toml }
        - { path: packages/nm/Cargo.toml, snapshot: folo-3e1f241-expected/packages/nm/Cargo.toml }
        - { path: packages/nm_otel/Cargo.toml, snapshot: folo-3e1f241-expected/packages/nm_otel/Cargo.toml }
        - { path: packages/par_bench/Cargo.toml, snapshot: folo-3e1f241-expected/packages/par_bench/Cargo.toml }
        - { path: packages/region_cached/Cargo.toml, snapshot: folo-3e1f241-expected/packages/region_cached/Cargo.toml }
        - { path: packages/region_local/Cargo.toml, snapshot: folo-3e1f241-expected/packages/region_local/Cargo.toml }
        - { path: packages/testing/Cargo.toml, snapshot: folo-3e1f241-expected/packages/testing/Cargo.toml }
        - { path: packages/ui_tests/Cargo.toml, snapshot: folo-3e1f241-expected/packages/ui_tests/Cargo.toml }
        - { path: packages/vicinal/Cargo.toml, snapshot: folo-3e1f241-expected/packages/vicinal/Cargo.toml }
  - name: stage-7-inline-table-form
    type: file
    config:
      # Manifest-only fixture: stage 7 cannot raise actual minimum
      # versions without source/lockfile context, so the patch
      # component is allowed to be 0. This grader instead verifies
      # the inline-table form is preserved with a 3-component
      # version range. A future devenv-empowered eval should add a
      # separate `stage-7-min-version-bumps` grader with
      # `[1-9]\d*` patterns to require real bumps.
      content_patterns:
        - path: Cargo.toml
          must_match:
            - 'libc\s*=\s*\{\s*version\s*=\s*"0\.2\.\d+"'
            - 'proc-macro2\s*=\s*\{\s*version\s*=\s*"1\.0\.\d+"'
            - 'tracing\s*=\s*\{\s*version\s*=\s*"0\.1\.\d+"'
            - 'syn\s*=\s*\{\s*version\s*=\s*"2\.0\.\d+"'
            - 'fake_headers\s*=\s*\{\s*version\s*=\s*"0\.0\.\d+"'

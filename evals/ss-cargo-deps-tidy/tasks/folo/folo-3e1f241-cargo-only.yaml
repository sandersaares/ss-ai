id: folo-3e1f241-cargo-only
name: Folo @ 3e1f241 - Cargo.toml-only tidy
description: >
  Real-world fixture extracted from folo-rs/folo at commit
  3e1f241ddfb6de7ab0ecca1a54ca923807135d83. The agent is given only the
  Cargo.toml files (no source, no Cargo.lock, no AGENTS.md) and asked to
  apply ss-cargo-deps-tidy without running cargo. Exercises stages 2
  (version padding), 4 (centralization), 5 (default-features), and 6
  (feature placement). Stage 7 (min-version verification) is partially
  covered via regex spot-checks against patch components that folo
  required to satisfy minimum version compatibility.
tags:
  - workflow
timeout_seconds: 1800
inputs:
  prompt: |-
    The Cargo.toml files of a Rust workspace have been placed in your
    workspace directory. The root manifest is `Cargo.toml`; member
    manifests live under `packages/*/Cargo.toml`.

    Apply the `ss-cargo-deps-tidy` skill to this workspace.

    Important constraints for this run:

    - This is a manifest-only fixture. There are no source files, no
      Cargo.lock, no AGENTS.md, and no justfile. Do not attempt to run
      any `cargo` commands; the skill's workspace build verification
      (the `cargo check` step in stage 5 and the entire stage 7
      `cargo generate-lockfile` / build pass) is out of scope here.

    - Still perform the stage 7 reasoning where possible: if a workspace
      dependency declares a version requirement with fewer than three
      components, pad it; and if you have reason to believe the declared
      minimum version is below what the published code actually requires,
      raise it accordingly.

    - All other stages (1 inventory, 2 style, 3 dev-deps path-only,
      4 centralization, 5 default-features, 6 package-level features,
      8 cleanup) apply as written.
  files:
    - path: Cargo.toml
    - path: packages/alloc_tracker/Cargo.toml
    - path: packages/all_the_time/Cargo.toml
    - path: packages/awaiter_set/Cargo.toml
    - path: packages/benchmarks/Cargo.toml
    - path: packages/cargo-detect-package/Cargo.toml
    - path: packages/cpulist/Cargo.toml
    - path: packages/events/Cargo.toml
    - path: packages/events_once/Cargo.toml
    - path: packages/fast_time/Cargo.toml
    - path: packages/folo_ffi/Cargo.toml
    - path: packages/folo_utils/Cargo.toml
    - path: packages/future_deque/Cargo.toml
    - path: packages/infinity_pool/Cargo.toml
    - path: packages/linked/Cargo.toml
    - path: packages/linked_macros/Cargo.toml
    - path: packages/linked_macros_impl/Cargo.toml
    - path: packages/many_cpus/Cargo.toml
    - path: packages/many_cpus_benchmarking/Cargo.toml
    - path: packages/new_zealand/Cargo.toml
    - path: packages/nm/Cargo.toml
    - path: packages/nm_otel/Cargo.toml
    - path: packages/par_bench/Cargo.toml
    - path: packages/region_cached/Cargo.toml
    - path: packages/region_local/Cargo.toml
    - path: packages/testing/Cargo.toml
    - path: packages/ui_tests/Cargo.toml
    - path: packages/vicinal/Cargo.toml
expected:
  outcomes:
    - type: task_completed
graders:
  - name: cargo-tidy-sentinels
    type: file
    config:
      # Quick regex spot-checks of a few concrete deltas. These overlap with
      # the program grader on purpose so each can catch the other's blind
      # spots; failures here are immediately legible from the JSON results.
      content_patterns:
        - path: Cargo.toml
          must_match:
            # Stage 4 centralization: cpu-time was hoisted from
            # packages/all_the_time to the workspace root.
            - 'cpu-time\s*='
            # Stage 2 padding: arc-swap version went from "1.7" to 3 components.
            - 'arc-swap\s*=\s*\{[^}]*version\s*=\s*"1\.7\.\d+"'
            # Stage 6 feature placement: argh now declares "default" at workspace level.
            - 'argh\s*=\s*\{[^}]*"default"'
          must_not_match:
            # Stage 6: argh's pre-tidy "help" feature must be gone.
            - 'argh\s*=\s*\{[^}]*"help"'
            # Stage 6: futures' pre-tidy "executor" feature must be gone.
            - 'futures\s*=\s*\{[^}]*"executor"'
  - name: cargo-tidiness-checks
    type: program
    config:
      # Semantic validation via Generate-Inventory: enforces Stage 2/4/5/6
      # universally across every workspace dep, plus the fixture-specific
      # centralizations and feature edits encoded in the expectations JSON.
      # Stage 7 bumps are intentionally NOT required here - the cargo-only
      # task's prompt excludes the cargo verification step that would
      # justify them.
      command: pwsh
      args:
        - -NoProfile
        - -File
        - evals/ss-cargo-deps-tidy/scripts/Test-CargoTidied.ps1
        - -ExpectationsPath
        - evals/ss-cargo-deps-tidy/fixtures/folo-3e1f241-expectations.json
        - -InventoryScript
        - skills/ss-cargo-deps-tidy/Generate-Inventory.ps1
      timeout: 60

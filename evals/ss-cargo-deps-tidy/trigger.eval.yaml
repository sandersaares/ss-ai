name: ss-cargo-deps-tidy-trigger
description: >
  Trigger-precision tasks for the ss-cargo-deps-tidy skill: positive
  prompts that should activate the skill and negative prompts that
  should not. Inexpensive - no fixture preparation, no source-tree
  workflow exercise.
# Name the target for current Waza validation, but prevent body injection so
# activation still requires the agent to invoke the skill.
skill: ss-cargo-deps-tidy
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: true
  executor: copilot-sdk
  model: claude-opus-4.8
  inject_skill_body: false
  # Negative tasks forbid any skill invocation; isolate the target measurement
  # from unrelated skills installed by the combined repository.
  disabled_skills:
    - ss-review
    - ss-review-proactor
    - ss-review-deep
    - ss-autoreapprove
metrics:
  # Every trigger assertion contributes equally and is required to pass.
  - name: pass_rate
    weight: 1
    threshold: 1
tasks:
  - "tasks/trigger/*.yaml"

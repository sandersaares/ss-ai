name: ss-cargo-deps-tidy-eval
description: >
  Evaluation suite for the ss-cargo-deps-tidy skill. Iteration 1 covers
  trigger precision (positive and negative prompts) and a real-world
  manifest-only fixture extracted from folo-rs/folo at commit
  3e1f241ddfb6de7ab0ecca1a54ca923807135d83.
skill: ss-cargo-deps-tidy
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 1800
  parallel: false
  executor: copilot-sdk
  # Tracked README/skill target is Claude Opus 4.7, but Waza 0.31.0's
  # supported-model list (apparently hardcoded) does not include it yet,
  # so we pin to 4.6 here. Bump when Waza ships an updated list.
  model: claude-opus-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Aggregate score across all task-level graders.
hooks:
  # Iteration 3 (folo-3e1f241-full): clones folo at the pinned commit
  # into fixtures/.eval-cache/ and regenerates tasks/folo/folo-3e1f241-full.yaml
  # with one inputs.files entry per source file. before_run fires before
  # task discovery, so the generated YAML is picked up in the same run.
  before_run:
    - command: pwsh -NoProfile -File evals/ss-cargo-deps-tidy/scripts/Generate-FoloFullTask.ps1
      error_on_fail: true
tasks:
  - "tasks/trigger/*.yaml"
  - "tasks/folo/*.yaml"

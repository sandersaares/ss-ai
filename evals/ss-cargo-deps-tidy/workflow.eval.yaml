name: ss-cargo-deps-tidy-workflow
description: >
  End-to-end workflow tasks for the ss-cargo-deps-tidy skill. Includes
  a real-world fixture extracted from folo-rs/folo at commit
  3e1f241ddfb6de7ab0ecca1a54ca923807135d83 (manifest-only and full
  source-tree variants). Loads a `before_run` hook that clones folo
  and generates the full-source task YAML.
skill: ss-cargo-deps-tidy
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 1800
  parallel: true
  executor: copilot-sdk
  model: claude-opus-4.8
metrics:
  # All retained fixture assertions are required; no partial-credit cutover.
  - name: pass_rate
    weight: 1
    threshold: 1
hooks:
  # Clones folo at the pinned commit into fixtures/.eval-cache/ and
  # regenerates tasks/folo/folo-3e1f241-full.yaml with one inputs.files
  # entry per source file. before_run fires before task discovery, so
  # the generated YAML is picked up in the same run.
  before_run:
    - command: pwsh -NoProfile -File dev/ss-cargo-deps-tidy/evals/Generate-FoloFullTask.ps1
      error_on_fail: true
tasks:
  - "tasks/folo/*.yaml"
  - "tasks/inherited-dev-deps/*.yaml"

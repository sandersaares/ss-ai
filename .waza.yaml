# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/config.schema.json

paths:
  skills: skills/
  evals: evals/
  results: eval-results/
defaults:
  engine: copilot-sdk
  model: claude-opus-4.6
  timeout: 300
  parallel: false
  workers: 4
  verbose: false
  sessionLog: false
cache:
  enabled: false
  dir: .waza-cache
server:
  port: 3000
  resultsDir: eval-results/
dev:
  model: claude-opus-4.6
  target: medium-high
  maxIterations: 5
tokens:
  warningThreshold: 10000
  fallbackLimit: 25000
graders:
  programTimeout: 30
storage:
  containerName: waza-results

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Cargo and rustdoc compile in both jobs, including prerequisites built by Pester.
# The direct rustc provider build uses the same policy through the test runner.
env:
  CARGO_ENCODED_RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  SS_AI_DENY_RUST_WARNINGS: "1"

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Native prerequisites build on disposable runners; retain backtrace lines without full debug data.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tests: ./tests
          # Report suites use offline prerequisites and do not install the report stack.
          - os: ubuntu-latest
            tests: ./tests/Install.Tests.ps1,./tests/AgentInstallation.Tests.ps1,./tests/NativeInstallation.Tests.ps1,./tests/BashEnvironment.Tests.ps1,./tests/LibraryLayout.Tests.ps1,./tests/InvokeTests.Tests.ps1,./tests/InstallCiPester.Tests.ps1,./tests/SsReviewGitDiff.Tests.ps1,./tests/SsReviewPullRequestAnchor.Tests.ps1,./tests/SsReviewReportTools.Tests.ps1,./tests/ss-cargo-deps-tidy
          # macOS supports the PowerShell-only Cargo helper and directory linking, not native setup.
          - os: macos-latest
            tests: ./tests/Install.Tests.ps1,./tests/InstallCiPester.Tests.ps1,./tests/ss-cargo-deps-tidy
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        # Keep runner selection independent of the separately installed newer major release.
        shell: pwsh
        run: ./scripts/Install-CiPester.ps1
      - name: Select repository toolchain
        if: matrix.os != 'macos-latest'
        shell: pwsh
        run: rustup show active-toolchain
      - name: Run tests
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1 -Path ('${{ matrix.tests }}' -split ',')

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      RUST_BACKTRACE: 1
      # Disposable runners do not reuse incremental state; line tables preserve useful backtraces.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      # Hosted runners supply native compiler/linker prerequisites for mimalloc.
      - name: Select repository toolchain
        shell: pwsh
        run: rustup show active-toolchain
      - name: Native validation and isolated installation
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1 -Suite Rust
      # Use the installer path so release/default-feature warnings cannot hide behind test builds.
      - name: Validate release installation
        shell: pwsh
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/ss-ai-warning-check
        run: |
          #Requires -Version 7.6
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/lib/NativeUtility.ps1
          Invoke-SkillsUtilityCargo -UtilityPath (Join-Path $PWD 'packages/ss-ai') | Out-Null

[package]
name = "ss-ai-review-workflow-fuzz"
description = "Bounded audit fuzz targets for ss-ai-review-workflow"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include.workspace = true

[package.metadata]
cargo-fuzz = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
libfuzzer-sys = { workspace = true, features = ["link_libfuzzer"] }
serde_json = { workspace = true }
ss-ai-review-workflow = { workspace = true }
ss-ai-runtime = { workspace = true }

[[bin]]
name = "audit"
path = "fuzz_targets/audit.rs"
test = false
doc = false
bench = false

[lints]
workspace = true

[package]
name = "ss-skills-review"
description = "Review and reapproval operations for skills"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
jiff = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls", "system-proxy"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
ss-skills-assessment = { workspace = true }
ss-skills-runtime = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
static_assertions = { workspace = true }

[lints]
workspace = true

[package]
name = "ss-ai-review-fuzz"
description = "Bounded provider capture and publication fuzz targets for ss-ai-review"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include.workspace = true

[package.metadata]
cargo-fuzz = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
jiff = { workspace = true }
libfuzzer-sys = { workspace = true, features = ["link_libfuzzer"] }
ohno = { workspace = true }
serde_json = { workspace = true }
# The fuzz targets use the utility's private simulation entry points.
ss-ai-review = { workspace = true, features = ["private-fuzz"] }
ss-ai-runtime = { workspace = true }

[[bin]]
name = "provider_capture"
path = "fuzz_targets/provider_capture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "overview_validator"
path = "fuzz_targets/overview_validator.rs"
test = false
doc = false
bench = false

[[bin]]
name = "final_review"
path = "fuzz_targets/final_review.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracker_body"
path = "fuzz_targets/tracker_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracker_transaction"
path = "fuzz_targets/tracker_transaction.rs"
test = false
doc = false
bench = false

[lints]
workspace = true

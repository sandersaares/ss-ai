[package]
name = "ss-ai-cargo"
description = "Read-only Cargo dependency inventory for ss-ai skills"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# Exposes the in-process parser adapter only to the nonpublished fuzz harness.
fuzzing = []

[dependencies]
glob = { workspace = true }
jiff = { workspace = true }
ohno = { workspace = true }
same-file = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml_edit = { workspace = true, features = ["parse"] }

[dev-dependencies]
serde_json = { workspace = true }
static_assertions = { workspace = true }

[lints]
workspace = true
